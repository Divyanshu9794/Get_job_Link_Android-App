<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Device Offline</title>
    <style type="text/css">
      :root {
        --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0F172A;
        --text-secondary: #64748B;
        --accent: #0D9488;
        --accent-hover: #0F766E;
      }
      [data-theme="dark"] {
        --card-bg: rgba(30, 41, 59, 0.95);
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-gradient);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 40px 28px;
        width: 88%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      }
      .icon-container {
        width: 72px;
        height: 72px;
        background: rgba(13, 148, 136, 0.12);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }
      h2 {
        color: var(--text-primary);
        font-size: 22px;
        margin: 0 0 10px;
        font-weight: 700;
      }
      p {
        color: var(--text-secondary);
        font-size: 14px;
        margin: 0 0 28px;
        line-height: 1.5;
      }
      .btn {
        background: linear-gradient(135deg, #0D9488 0%, #0F766E 100%);
        color: #FFFFFF;
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        transition: transform 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-container">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
    </div>
    <h2>No Connection</h2>
    <p id="message">Please check your internet connection and tap below to retry.</p>
    <button class="btn" id="retryButton" type="button" onclick="median.webview.reload()">Retry Connection</button>
</div>
<script>
      function updateDarkMode(){
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      }
      updateDarkMode();
      if(window.matchMedia){
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateDarkMode);
      }
    </script>
</body>
</html>
